<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="ECO RJ - Centro de Treinamento em Ecocardiografia. Referência em atualização e ensino de ecocardiografia no Brasil com integração clínico-imagem." />
  <!-- ATENÇÃO: esta CSP é aplicada em INTERSEÇÃO com o header Content-Security-Policy
       definido em vercel.json (o navegador exige que a origem esteja liberada nos dois).
       Ao liberar um domínio novo, atualize os DOIS lugares — mantenha-os idênticos. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://*.zoom.us https://zoom.us https://*.zoomgov.com https://*.cloudfront.net https://sdk.mercadopago.com https://http2.mlstatic.com https://*.mlstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://http2.mlstatic.com; font-src 'self' https://fonts.gstatic.com https://http2.mlstatic.com; img-src 'self' data: blob: https://i.imgur.com https://*.imgur.com https://*.zoom.us https://zoom.us https://*.cloudfront.net https://i.vimeocdn.com https://*.ytimg.com https://*.google.com https://http2.mlstatic.com https://*.mlstatic.com https://*.mercadolibre.com https://*.mercadolivre.com https://*.public.blob.vercel-storage.com; connect-src 'self' https://i.imgur.com https://*.imgur.com https://*.zoom.us https://zoom.us wss://*.zoom.us https://api.zoom.us wss://*.zoomgov.com https://*.cloudfront.net https://*.google.com https://vimeo.com https://*.vimeo.com https://api.mercadopago.com https://api.mercadolibre.com https://*.mercadolibre.com https://*.mercadolivre.com https://sdk.mercadopago.com https://http2.mlstatic.com https://*.mlstatic.com https://events.mercadopago.com https://vercel.com https://blob.vercel-storage.com https://*.blob.vercel-storage.com https://*.public.blob.vercel-storage.com; frame-src 'self' https://*.zoom.us https://zoom.us https://player.vimeo.com https://*.vimeo.com https://www.youtube.com https://youtube.com https://www.youtube-nocookie.com https://www.google.com https://www.openstreetmap.org https://*.openstreetmap.org https://*.mercadopago.com https://*.mercadolibre.com https://*.mercadolivre.com; media-src 'self' blob: https://*.zoom.us https://*.cloudfront.net; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ecorj.com.br/" />
  <meta property="og:title" content="ECO RJ - Centro de Treinamento em Ecocardiografia" />
  <meta property="og:description"
    content="Domine a Ecocardiografia com os melhores especialistas. Cursos práticos e avançados com foco na excelência clínica e diagnóstica." />
  <meta property="og:image" content="https://i.imgur.com/Rgz0BWF.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://ecorj.com.br/" />
  <meta property="twitter:title" content="ECO RJ - Centro de Treinamento em Ecocardiografia" />
  <meta property="twitter:description"
    content="Domine a Ecocardiografia com os melhores especialistas. Cursos práticos e avançados com foco na excelência clínica e diagnóstica." />
  <meta property="twitter:image" content="https://i.imgur.com/Rgz0BWF.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Newsreader (display serifado) · IBM Plex Sans (corpo) · IBM Plex Mono (dado).
       Três famílias — o teto do sistema. Ver design.md § Typography. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <title>ECO RJ - Centro de Treinamento em Ecocardiografia</title>
</head>

<body>
  <div id="root">
    <!-- Splash screen instantâneo - aparece antes do React carregar -->
    <div id="splash" style="
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #F7F9FC;
        z-index: 9999;
        transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      ">
      <img src="https://i.imgur.com/Rgz0BWF.png" alt="ECO RJ" fetchpriority="high"
        style="width: 92px; height: auto;" />
      <div style="
          font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
          font-size: 11px;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: #687078;
        ">Centro de Treinamento em Ecocardiografia</div>
      <div id="splash-rule" style="width: 120px; height: 1px; background: #D2D8DF; overflow: hidden;">
        <div style="width: 40%; height: 100%; background: #014E8E; animation: splash-sweep 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;"></div>
      </div>
      <style>
        @keyframes splash-sweep {
          0%   { transform: translateX(-100%); }
          100% { transform: translateX(300%); }
        }

        @media (prefers-reduced-motion: reduce) {
          #splash-rule > div { animation-duration: 2.2s; }
        }

        @media (prefers-color-scheme: dark) {
          #splash { background: #090E13 !important; }
          #splash-rule { background: #293037 !important; }
          #splash-rule > div { background: #73A9E5 !important; }
        }
      </style>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
